<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ratão Chat Global</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1e1e24; color: white; margin: 0; padding: 20px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box;}
        #chat-box { flex: 1; background: #2b2b36; border-radius: 8px; padding: 15px; overflow-y: auto; margin-bottom: 10px; display: flex; flex-direction: column; gap: 10px;}
        .msg { background: #3a3a47; padding: 10px; border-radius: 5px; }
        .msg span { font-weight: bold; color: #ffcc00; }
        .inputs { display: flex; gap: 10px; }
        input { padding: 10px; border-radius: 5px; border: none; outline: none; }
        #username { width: 100px; }
        #message { flex: 1; }
        button { background: #ffcc00; color: #1e1e24; border: none; padding: 10px 20px; font-weight: bold; border-radius: 5px; cursor: pointer; }
        button:hover { background: #e6b800; }
    </style>
</head>
<body>

    <h2>Chat Global (Render DB)</h2>
    <div id="chat-box"></div>

    <div class="inputs">
        <input type="text" id="username" placeholder="Seu nome" value="Emanuel">
        <input type="text" id="message" placeholder="Digite uma mensagem..." onkeypress="handleEnter(event)">
        <button onclick="enviar()">Enviar</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const chatBox = document.getElementById('chat-box');

        function adicionarMensagemNaTela(username, text) {
            const div = document.createElement('div');
            div.className = 'msg';
            div.innerHTML = `<span>${username}:</span> ${text}`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Carrega o histórico ao entrar
        socket.on('historico', (mensagens) => {
            mensagens.forEach(msg => adicionarMensagemNaTela(msg.username, msg.text));
        });

        // Recebe novas mensagens em tempo real
        socket.on('mensagem', (msg) => {
            adicionarMensagemNaTela(msg.username, msg.text);
        });

        function enviar() {
            const username = document.getElementById('username').value || 'Anônimo';
            const text = document.getElementById('message').value;

            if (text.trim() !== '') {
                socket.emit('mensagem', { username, text });
                document.getElementById('message').value = '';
            }
        }

        function handleEnter(e) {
            if (e.key === 'Enter') enviar();
        }
    </script>
</body>
</html>
