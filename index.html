<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RATÃO CHAT GLOBAL</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0c10;
            color: #c5c6c7;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background-color: #1f2833;
            padding: 15px 20px;
            text-align: center;
            border-bottom: 3px solid #66fcf1;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        header h1 {
            font-size: 24px;
            color: #66fcf1;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Scrollbar personalizada */
        #chat-box::-webkit-scrollbar {
            width: 8px;
        }
        #chat-box::-webkit-scrollbar-thumb {
            background: #45a29e;
            border-radius: 4px;
        }

        .msg {
            background-color: #1f2833;
            padding: 12px 15px;
            border-radius: 8px;
            max-width: 85%;
            word-wrap: break-word;
            border-left: 4px solid #45a29e;
            animation: fadeIn 0.3s ease-in-out;
        }

        .msg span {
            font-weight: 700;
            color: #66fcf1;
            margin-right: 5px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .inputs {
            display: flex;
            padding: 20px;
            background-color: #111;
            border-top: 1px solid #1f2833;
            gap: 10px;
        }

        input {
            padding: 12px;
            border: none;
            border-radius: 6px;
            background-color: #1f2833;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            box-shadow: 0 0 5px #66fcf1;
        }

        #username {
            width: 25%;
            max-width: 150px;
        }

        #message {
            flex: 1;
        }

        button {
            background-color: #66fcf1;
            color: #0b0c10;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #45a29e;
            color: #fff;
            transform: scale(1.05);
        }

        /* Responsividade para ecrãs menores */
        @media (max-width: 600px) {
            .inputs {
                flex-direction: column;
            }
            #username {
                width: 100%;
                max-width: none;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Ratão Chat Global</h1>
    </header>

    <div id="chat-box"></div>

    <div class="inputs">
        <input type="text" id="username" placeholder="Seu nome" value="Emanuel">
        <input type="text" id="message" placeholder="Digite sua mensagem..." autocomplete="off">
        <button id="btn-enviar">Enviar</button>
    </div>

    <!-- O script do socket.io é servido automaticamente pelo backend -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io(); // Conecta automaticamente ao mesmo link do servidor
        const chatBox = document.getElementById('chat-box');
        const btnEnviar = document.getElementById('btn-enviar');
        const inputMessage = document.getElementById('message');
        const inputUsername = document.getElementById('username');

        function adicionarMensagemNaTela(username, text) {
            const div = document.createElement('div');
            div.className = 'msg';
            div.innerHTML = `<span>${username}:</span> ${text}`;
            chatBox.appendChild(div);
            // Faz scroll automático para a mensagem mais recente
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Puxa o histórico quando entras
        socket.on('historico', (mensagens) => {
            mensagens.forEach(msg => adicionarMensagemNaTela(msg.username, msg.text));
        });

        // Ouve mensagens novas em tempo real
        socket.on('mensagem', (msg) => {
            adicionarMensagemNaTela(msg.username, msg.text);
        });

        function enviar() {
            const username = inputUsername.value.trim() || 'Anônimo';
            const text = inputMessage.value.trim();

            if (text !== '') {
                socket.emit('mensagem', { username, text });
                inputMessage.value = ''; // Limpa o campo
                inputMessage.focus(); // Mantém o teclado aberto/pronto
            }
        }

        // Envia ao clicar no botão
        btnEnviar.addEventListener('click', enviar);

        // Envia ao pressionar "Enter"
        inputMessage.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                enviar();
            }
        });
    </script>
</body>
</html>
